name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: dev, POSTGRES_DB: pinpulse }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      # Unit + tenancy/RLS + crypto + purge tests run against real Postgres (the app connects as a non-owner role).
      - run: pnpm --filter web test
        env: { CHROME_PATH: /usr/bin/google-chrome }
      - run: pnpm --filter @pinpulse/pinterest-mock test
      - run: pnpm --filter web build
  analytics:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/analytics } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy pinpulse_analytics --ignore-missing-imports
      - run: pytest -q
      - name: Baseline may not change in the same PR as detector code
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$changed" | grep -q "benchmark_baseline.json" && echo "$changed" | grep -q "pinpulse_analytics/detectors.py"; then
            echo "Update benchmark_baseline.json in a separate PR after the detector change merges"; exit 1; fi
      - name: Benchmark gate
        run: |
          python -m pinpulse_analytics.benchmark --json > /tmp/bench.json
          python - <<'PY'
          import json; b=json.load(open("benchmark_baseline.json"))["score"]; s=json.load(open("/tmp/bench.json"))["score"]
          print(f"score {s:.3f} baseline {b:.3f}"); assert s >= b - 0.01, "detector benchmark regressed"
          assert s >= 0.6, "detector benchmark below absolute floor 0.6"
          PY
  e2e:
    needs: [web, analytics]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: dev, POSTGRES_DB: pinpulse }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "services/analytics"
      # Pipeline e2e: OAuth → sync → integrity → analysis → alerts → reports → consent → purge, all 8 mock scenarios.
      - run: scripts/test-e2e.sh
        env: { CHROME_PATH: /usr/bin/google-chrome }
      # Browser e2e: the whole stack with MOCK Pinterest, driven through Chrome.
      - name: Browser e2e
        run: |
          cat > apps/web/.env.local <<ENV
          APP_URL=http://localhost:3000
          DATABASE_URL=postgres://pinpulse_app:pinpulse_app@localhost:5432/pinpulse
          DATABASE_OWNER_URL=postgres://postgres:dev@localhost:5432/pinpulse
          BETTER_AUTH_SECRET=$(openssl rand -base64 32)
          TOKEN_KEK_V1=$(openssl rand -base64 32)
          TOKEN_KEK_CURRENT=v1
          PINTEREST_MODE=mock
          INTEGRITY_ALLOW_PRIVATE_HOSTS=true
          CHROME_PATH=/usr/bin/google-chrome
          ENV
          CHROME_PATH=/usr/bin/google-chrome scripts/test-browser.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright, path: apps/web/test-results }
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx -y gitleaks@latest detect --no-git -v || true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

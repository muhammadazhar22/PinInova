services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: dev, POSTGRES_DB: pinpulse }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  analytics:
    build: services/analytics
    command: uvicorn pinpulse_analytics.api:app --host 0.0.0.0 --port 8000 --reload
    volumes: ["./services/analytics:/app"]
    ports: ["8000:8000"]
volumes: { pgdata: {} }
